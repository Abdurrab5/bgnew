[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgnew"
version = "2.1.0"
description = "Xhunta AI Image Background Remover API"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi[standard]==0.136.3",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "Pillow==12.2.0",
    "numpy==2.4.6",
    "onnxruntime==1.26.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools]
py-modules = ["main", "config", "middleware"]

[tool.setuptools.packages.find]
include = ["routes*", "services*"]
